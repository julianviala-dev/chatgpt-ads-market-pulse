name: Build Pulse
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: ./scripts/pulse demo
      - uses: actions/upload-artifact@v4
        with:
          name: market-pulse-html
          path: runs/latest/market-pulse.html
